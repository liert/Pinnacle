[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pinnacle"
version = "0.1.0"
description = "AArch64 ELF call injection toolkit"
requires-python = ">=3.10"
dependencies = [
  "lief",
  "keystone-engine",
  "capstone",
]

[project.optional-dependencies]
test = ["pytest"]
cli = ["rich"]

[project.scripts]
pinnacle = "pinnacle.cli:main"
